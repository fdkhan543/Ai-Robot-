<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Robot</title><style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1020;
  color: white;
  height: 100vh;
}

.app {
  max-width: 500px;
  margin: auto;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.header {
  padding: 20px;
  text-align: center;
  background: #111a33;
  border-bottom: 1px solid #263354;
}

.robot {
  font-size: 65px;
  margin-bottom: 5px;
}

.header h1 {
  margin: 0;
  font-size: 24px;
}

.status {
  color: #62ff9b;
  font-size: 13px;
  margin-top: 5px;
}

.chat {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
}

.message {
  padding: 12px 15px;
  border-radius: 15px;
  margin: 10px 0;
  max-width: 85%;
  line-height: 1.4;
}

.bot {
  background: #182542;
  margin-right: auto;
}

.user {
  background: #3157d5;
  margin-left: auto;
}

.input-area {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: #111a33;
}

input {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: 25px;
  outline: none;
  font-size: 15px;
}

button {
  border: none;
  border-radius: 50%;
  width: 48px;
  height: 48px;
  background: #3157d5;
  color: white;
  font-size: 20px;
}

button:active {
  transform: scale(0.95);
}
</style></head><body><div class="app">  <div class="header">
    <div class="robot">🤖</div>
    <h1>AI Robot</h1>
    <div class="status">● Online</div>
  </div>  <div class="chat" id="chat">
    <div class="message bot">
      Hello! 👋 I am your AI Robot.<br>
      Ask me anything.
    </div>
  </div>  <div class="input-area">
    <input
      id="messageInput"
      type="text"
      placeholder="Type your message..."
      autocomplete="off"
    /><button onclick="sendMessage()">➤</button>

  </div></div><script>
function sendMessage() {

  const input = document.getElementById("messageInput");
  const chat = document.getElementById("chat");

  const message = input.value.trim();

  if (message === "") return;

  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.textContent = message;

  chat.appendChild(userMessage);

  input.value = "";

  setTimeout(() => {

    const botMessage = document.createElement("div");
    botMessage.className = "message bot";

    botMessage.textContent =
      "🤖 I received your message. My AI brain will be connected in the next step.";

    chat.appendChild(botMessage);

    chat.scrollTop = chat.scrollHeight;

  }, 500);

  chat.scrollTop = chat.scrollHeight;
}

document.getElementById("messageInput").addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    sendMessage();
  }
});
</script></body>
</html>
